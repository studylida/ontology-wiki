name: Shared knowledge assistant
on:
  push:
    branches: [feat/shared-knowledge-assistant-20261028]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-assistant-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve tracked source and inspect dependency advisories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/review/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/review/commit.txt"
          cd frontend
          # npm audit returns 1 for found advisories; retain the report rather than masking it as clean.
          set +e
          npm audit --json > "$RUNNER_TEMP/review/audit-all.json"
          ALL_STATUS=$?
          npm audit --omit=dev --json > "$RUNNER_TEMP/review/audit-production.json"
          PROD_STATUS=$?
          set -e
          echo "audit exit codes: all=$ALL_STATUS production=$PROD_STATUS"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"review"; [(print(f.name,json.loads(f.read_text())["metadata"]["vulnerabilities"])) for f in p.glob("audit-*.json")]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/review
          retention-days: 3
  foundation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation-ci-only
          POSTGRES_DB: ontology_assistant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ontology_assistant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OW_TEST_DATABASE_URL: postgresql+asyncpg://postgres:foundation-ci-only@127.0.0.1:5432/ontology_assistant_test
      PYTHONPATH: backend
      OW_PROVIDER_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify source syntax
        run: python -m compileall -q backend/knowledge tests/foundation tests/unit tests/evaluation tests/browser scripts/v2
      - name: Real PostgreSQL, HTTP and process-restart foundation tests
        run: python -m pytest tests/foundation tests/unit tests/evaluation -q --junitxml="$RUNNER_TEMP/foundation.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/foundation.xml
            ${{ runner.temp }}/evaluation
          retention-days: 3
  browser-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: browser-ci-only
          POSTGRES_DB: ontology_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ontology_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OW_TEST_DATABASE_URL: postgresql+asyncpg://postgres:browser-ci-only@127.0.0.1:5432/ontology_browser_test
      PYTHONPATH: backend
      OW_PROVIDER_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and production build
        working-directory: frontend
        run: npm run build
      - name: Frontend contract, safety and recovery tests
        working-directory: frontend
        run: npm test
      - name: Check removed user entry points
        run: |
          test ! -e index.html && test ! -d js
          if grep -RInE 'responseMode|autoWiki|/research|/personal-wiki|extended' frontend/src --include='*.ts' --include='*.tsx' --exclude='*.test.*'; then exit 1; fi
      - name: Install browser testing tools
        run: |
          python -m pip install -r backend/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Chromium with real API, PostgreSQL and indexing worker
        run: python -m pytest tests/browser -q --junitxml="$RUNNER_TEMP/browser.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browser.xml
            ${{ runner.temp }}/browser-artifacts
          retention-days: 3
          if-no-files-found: warn

name: Shared knowledge assistant

on:
  push:
    branches: [feat/shared-knowledge-assistant-20261028]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation-ci-only
          POSTGRES_DB: ontology_assistant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d ontology_assistant_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OW_TEST_DATABASE_URL: postgresql+asyncpg://postgres:foundation-ci-only@127.0.0.1:5432/ontology_assistant_test
      PYTHONPATH: backend
      OW_PROVIDER_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify source syntax
        run: python -m compileall -q backend/knowledge tests/foundation scripts/v2/dev.py
      - name: Real PostgreSQL, HTTP and process-restart foundation tests
        run: python -m pytest tests/foundation -q --junitxml="$RUNNER_TEMP/foundation.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-results-${{ github.sha }}
          path: ${{ runner.temp }}/foundation.xml
          retention-days: 3
          if-no-files-found: warn

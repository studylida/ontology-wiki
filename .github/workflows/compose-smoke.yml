name: Isolated Compose smoke

on:
  push:
    branches: [feat/conversation-rag-redesign-20261026]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Build and verify isolated fixture stack
        run: python3 scripts/v2/compose_smoke.py run --state-dir "$RUNNER_TEMP/ontology-compose-smoke"
      - name: Remove only the smoke project's containers and volumes
        if: always()
        run: python3 scripts/v2/compose_smoke.py cleanup --state-dir "$RUNNER_TEMP/ontology-compose-smoke"
